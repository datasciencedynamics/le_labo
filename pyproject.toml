[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lelabo-whitespace"
version = "0.1.0"
description = "Scrape Le Labo store locations, score US counties for whitespace, and render an interactive HTML map."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "numpy>=1.23", "scikit-learn>=1.2", "shapely>=2.0"]

[project.optional-dependencies]
scrape = ["playwright>=1.40"]

[project.scripts]
lelabo-whitespace = "lelabo_whitespace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lelabo_whitespace = ["assets/*"]
